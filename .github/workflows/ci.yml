name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.arch }} / ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x64
          - os: ubuntu-latest
            arch: x64
            build_type: Debug
          - os: ubuntu-latest
            arch: x64
            build_type: Release

          # Linux ARM64
          - os: ubuntu-24.04-arm
            arch: arm64
            build_type: Debug
          - os: ubuntu-24.04-arm
            arch: arm64
            build_type: Release

          # Windows x64
          - os: windows-latest
            arch: x64
            build_type: Debug
          - os: windows-latest
            arch: x64
            build_type: Release

          # Windows ARM64
          - os: windows-11-arm
            arch: arm64
            build_type: Debug
          - os: windows-11-arm
            arch: arm64
            build_type: Release

          # macOS ARM64 (Apple Silicon)
          - os: macos-latest
            arch: arm64
            build_type: Debug
          - os: macos-latest
            arch: arm64
            build_type: Release

          # macOS x64 (Intel)
          - os: macos-15-intel
            arch: x64
            build_type: Debug
          - os: macos-15-intel
            arch: x64
            build_type: Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} -j

      - name: Test
        run: ctest --test-dir build --output-on-failure -C ${{ matrix.build_type }}

      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.build_type }}
          path: build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore